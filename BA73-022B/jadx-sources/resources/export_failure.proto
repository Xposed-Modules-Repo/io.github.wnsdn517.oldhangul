edition = "2023";

package os_migration_data_types.v1;

option java_multiple_files = true;

message ExportFailureSummary {
  uint64 untransferable_item_count = 1;
  uint64 failed_item_count = 2;
  repeated string failure_messages = 3;
}

enum ExportFailureState {
  EXPORT_FAILURE_STATE_UNSPECIFIED = 0;
  EXPORT_FAILURE_STATE_UNTRANSFERABLE = 1;
  EXPORT_FAILURE_STATE_EXPORT_FAILED = 2;
}

message ExportFailure {
  ExportFailureState failure_state = 1;
  string failure_message = 2;
}