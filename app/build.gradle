plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.wnsdn517.oldhangul'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.wnsdn517.oldhangul'
        minSdk 28
        targetSdk 35
        versionCode 18
        versionName '0.7.2'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            // LSPosed loads native libraries straight from base.apk!/lib/<abi>,
            // which only works when they are stored uncompressed and aligned.
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation project(':engine')
    implementation 'org.luckypray:dexkit:2.0.3'
    // DexKit is written in Kotlin but does not bring the standard library along.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    compileOnly 'de.robv.android.xposed:api:82'
}
