name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Test and build
        run: ./gradlew --no-daemon :engine:test :app:assembleRelease
      - name: Check native libraries are stored uncompressed
        run: |
          unzip -v app/build/outputs/apk/release/app-release.apk 'lib/*' | tee /tmp/libs.txt
          grep -q 'lib/arm64-v8a/libdexkit.so' /tmp/libs.txt
          if grep 'lib/.*\.so' /tmp/libs.txt | grep -qv ' Stored '; then
            echo "Native libraries must be stored uncompressed for LSPosed" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SamsungKeyboardOldKorean-apk
          path: app/build/outputs/apk/release/app-release.apk
